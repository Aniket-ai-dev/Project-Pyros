services:
  - type: web
    name: nasa-fire-safety-engine
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
